name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Check
        run: scripts/ci.sh origin/${{ github.base_ref || 'main' }}
